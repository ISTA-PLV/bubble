# SPDX-License-Identifier: Apache-2.0

name: Build, test, and lint Bubble

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          build: "true"
          test: "true"
          lint: "true"
          lint-args: "Bubble BubbleTest"
          use-mathlib-cache: "false"
