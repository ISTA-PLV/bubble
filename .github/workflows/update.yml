# SPDX-License-Identifier: Apache-2.0

name: Daily upstream compatibility

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Latest Iris commit
            mode: iris
          - name: Latest stable Lean
            mode: lean
    steps:
      - uses: actions/checkout@v7
      - name: Select upstream versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ matrix.mode }}
        run: |
          iris_rev=$(git ls-remote https://github.com/leanprover-community/iris-lean.git HEAD | cut -f1)
          sed -i "/^name = \"iris\"$/,/^rev = /s/^rev = .*/rev = \"$iris_rev\"/" Bubble/lakefile.toml
          if [[ "$MODE" == "lean" ]]; then
            lean_tag=$(gh api repos/leanprover/lean4/releases/latest --jq .tag_name)
            printf 'leanprover/lean4:%s\n' "$lean_tag" > Bubble/lean-toolchain
          else
            curl -fsSL "https://raw.githubusercontent.com/leanprover-community/iris-lean/$iris_rev/Iris/lean-toolchain" > Bubble/lean-toolchain
          fi
          cp Bubble/lean-toolchain BubbleTest/lean-toolchain
          echo "Iris commit: $iris_rev"
          cat Bubble/lean-toolchain
      - name: Install the selected Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Bubble
          auto-config: "false"
          use-github-cache: "false"
          use-mathlib-cache: "false"
      - name: Update, build, test, and lint
        run: |
          cd Bubble
          lake --keep-toolchain update
          lake build
          lake lint
          cd ../BubbleTest
          lake --keep-toolchain update
          lake test
          lake lint
