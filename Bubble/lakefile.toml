name = "bubble"
version = "0.1.0"
license = "Apache-2.0"
defaultTargets = ["Bubble"]
builtinLint = true

[leanOptions]
linter.unusedVariables = true
linter.unusedSectionVars = true
linter.deprecated = true
linter.extra.unreachableTactic = true
linter.extra.unnecessarySeqFocus = true

[[require]]
name = "iris"
git = "https://github.com/leanprover-community/iris-lean.git"
rev = "354ee07b3b47fc2c3fbf4e5f07887e10456fceae"
subDir = "Iris"

[[lean_lib]]
name = "Bubble"
