name = "bubble"
version = "0.1.0"
license = "Apache-2.0"
defaultTargets = ["Bubble"]
testDriver = "BubbleTest"
builtinLint = true

[leanOptions]
linter.unusedVariables = true
linter.unusedSectionVars = true
linter.deprecated = true
linter.extra.unreachableTactic = true
linter.extra.unnecessarySeqFocus = true

[[require]]
name = "iris"
git = "https://github.com/leanprover-community/iris-lean.git"
rev = "v4.35.0"
subDir = "Iris"

[[require]]
name = "Coinductive"
git = "https://github.com/ISTA-PLV/coinductive.git"
rev = "617e8cb27b69a14e3d3217c850d47fde8c37b5f1"

[[require]]
name = "aesop"
git = "https://github.com/leanprover-community/aesop.git"
rev = "v4.35.0"

[[require]]
name = "Wander"
git = "https://github.com/ayhon/wander.git"
rev = "3dd2882cd162258b58352f3927056fee885d7649"

# Wander uses the legacy Iris package name; keep both names on the same revision.
[[require]]
name = "Iris"
git = "https://github.com/leanprover-community/iris-lean.git"
rev = "v4.35.0"
subDir = "Iris"

[[lean_lib]]
name = "Bubble"

[[lean_lib]]
name = "BubbleTest"
globs = ["BubbleTest", "BubbleTest.+"]
